<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FanFlow AI - FIFA World Cup 2026 Assistant</title>
  <link rel="stylesheet" href="/static/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
</head>
<body class="theme-standard">
  <div class="app-container">
    <div id="auth-bar" style="background:#060A13; padding:8px 20px; font-size:0.85rem; color:#9BA4B5; border-bottom:1px solid #313C4E; display:flex; justify-content:space-between; align-items:center; z-index:20;">
      <span id="auth-info">Logged in as ...</span>
      <button id="logout-btn" style="background:none; border:none; color:#00A3E0; cursor:pointer; font-family:'Oswald', sans-serif; text-transform:uppercase; font-size:0.85rem;">Log out</button>
    </div>
    <header class="app-header scoreboard-header">
      <div class="header-content">
        <div class="title-wrapper">
          <span class="live-dot" aria-hidden="true"></span>
          <h1>FANFLOW AI</h1>
        </div>
        <p class="subtitle">FIFA WORLD CUP 2026™ • METLIFE STADIUM</p>
      </div>
      <div class="header-controls">
        <select id="language-select" aria-label="Select Language">
          <option value="en">English</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
          <option value="ar">العربية</option>
        </select>
        <button id="accessibility-toggle" class="icon-btn" aria-label="Toggle High Contrast Mode" title="High Contrast Mode">
          <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
            <!-- Simulating contrast icon -->
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 2a10 10 0 0 0 0 20z" fill="currentColor"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="chat-container" id="chat-container" aria-live="polite">
      <div class="message system-message">
        <div class="message-content">
          Welcome to MetLife Stadium! I'm FanFlow AI. How can I help you navigate the FIFA World Cup 2026™ today?
        </div>
      </div>
      <!-- Chat messages will be injected here -->
      <div id="typing-indicator" class="typing-indicator hidden" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
    </main>

    <div class="quick-replies" aria-label="Quick questions">
      <button class="quick-reply-btn" data-query="Where is the nearest gate with the shortest queue?">🏃 Shortest Gate Queue</button>
      <button class="quick-reply-btn" data-query="What is the most accessible wheelchair route to Section S3?">♿ Wheelchair Route</button>
      <button class="quick-reply-btn" data-query="Where is the nearest First Aid or medical center?">🏥 First Aid</button>
      <button class="quick-reply-btn" data-query="Are there any sensory-friendly or quiet rooms nearby?">🎧 Quiet Room</button>
    </div>

    <footer class="app-footer">
      <form id="chat-form" class="chat-form">
        <input 
          type="text" 
          id="chat-input" 
          placeholder="Ask about stadium navigation, amenities, etc..." 
          aria-label="Message FanFlow AI"
          autocomplete="off"
          required
        >
        <button type="submit" class="send-btn" aria-label="Send message">
          <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
    </footer>
  </div>
  <script src="/static/fan.js"></script>
</body>
</html>
