<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FanFlow AI - Organizer Dashboard</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/dashboard.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
</head>
<body class="theme-standard dashboard-body">
  <div class="dashboard-container">
    <div id="auth-bar" style="background:#060A13; padding:8px 32px; font-size:0.85rem; color:#9BA4B5; border-bottom:1px solid #313C4E; display:flex; justify-content:space-between; align-items:center; z-index:20;">
      <span id="auth-info">Logged in as ...</span>
      <button id="logout-btn" aria-label="Log out" style="background:none; border:none; color:#E3003F; cursor:pointer; font-family:'Oswald', sans-serif; text-transform:uppercase; font-size:0.85rem;">Log out</button>
    </div>
    <header class="app-header scoreboard-header">
      <div class="header-content">
        <div class="title-wrapper">
          <span class="live-dot" aria-hidden="true"></span>
          <h1>FANFLOW AI OPS</h1>
        </div>
        <p class="subtitle">COMMAND CENTER • METLIFE STADIUM</p>
      </div>
      <div class="header-controls">
      </div>
    </header>

    <main class="dashboard-main">
      <div class="dashboard-col left-col">
        <h2 class="section-title">📊 Live Zone Occupancy</h2>
        <div id="guidance-container" class="guidance-box">
          <h4 class="guidance-title">🤖 Live AI Routing Guidance</h4>
          <p id="guidance-text">Waiting for data...</p>
        </div>
        <div id="occupancy-container" class="occupancy-list">
          <!-- Bars injected here -->
        </div>
      </div>

      <div class="dashboard-col right-col">
        <h2 class="section-title">🚨 Prioritized AI Alerts</h2>
        <div class="metrics-row">
          <div class="metric-card">
            <div class="metric-label">Active Alerts</div>
            <div class="metric-value" id="total-alerts-val">0</div>
          </div>
          <div class="metric-card critical">
            <div class="metric-label">Critical Priority</div>
            <div class="metric-value" id="critical-alerts-val">0</div>
          </div>
        </div>
        <div id="alerts-container" class="alerts-list">
          <!-- Alerts injected here -->
        </div>
      </div>
    </main>
  </div>
  <script src="/static/staff.js"></script>
</body>
</html>
