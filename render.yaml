services:
  - type: web
    name: fanflow-ai
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GEMINI_API_KEY
        sync: false # Must be set manually in the Render Dashboard
      - key: STAFF_ACCESS_CODE
        sync: false # Must be set manually in the Render Dashboard
